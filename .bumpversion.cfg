[bumpversion]
current_version = 2.2.0
commit = True
tag = True

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file(dockerpin0):docker/Dockerfile]
search = keycloak-agent[mcp]=={current_version}
replace = keycloak-agent[mcp]=={new_version}

[bumpversion:file:keycloak_agent/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:keycloak_agent/api_client.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:keycloak_agent/mcp_server.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"
